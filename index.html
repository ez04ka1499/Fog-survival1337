<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MC GitHub Control Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; max-width: 600px; margin: 40px auto; padding: 20px; border-radius: 8px; background-color: #1e1e1e; }
        h.1, h2 { color: #4CAF50; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; cursor: pointer; font-weight: bold; }
        button:hover { background: #45a049; }
        .box { background: #252525; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        code { background: #333; padding: 2px 6px; border-radius: 4px; color: #4CAF50; }
    </style>
</head>
<body>

    <h2>🎮 Управление Minecraft Сервером на GitHub</h2>
    
    <div class="box">
        <h3>🔑 Настройки доступа</h3>
        <input type="text" id="repo" placeholder="username/repo-name">
        <input type="password" id="token" placeholder="GitHub Personal Access Token (repo scope)">
    </div>

    <div class="box">
        <h3>🌐 Статус и IP сервера</h3>
        <p>Адрес для подключения: <code id="server-ip">Загрузка...</code></p>
        <button onclick="fetchIp()">Обновить IP</button>
        <button onclick="startServer()">Запустить сервер (Workflow)</button>
    </div>

    <div class="box">
        <h3>💬 Консоль / Команды</h3>
        <input type="text" id="cmdInput" placeholder="Например: op ВашНик или say Привет">
        <button onclick="sendCmd()">Отправить команду</button>
    </div>

<script>
    // Автозаполнение из localStorage
    document.getElementById('repo').value = localStorage.getItem('mc_repo') || '';
    document.getElementById('token').value = localStorage.getItem('mc_token') || '';

    function saveConfig() {
        localStorage.setItem('mc_repo', document.getElementById('repo').value);
        localStorage.setItem('mc_token', document.getElementById('token').value);
    }

    async function fetchIp() {
        const repo = document.getElementById('repo').value;
        if (!repo) return alert('Введите репозиторий!');
        saveConfig();
        try {
            const res = await fetch(`https://raw.githubusercontent.com/${repo}/main/tunnel.txt?t=${Date.now()}`);
            const ip = await res.text();
            document.getElementById('server-ip').innerText = ip.trim() || 'Сервер еще не запущен';
        } catch (e) {
            document.getElementById('server-ip').innerText = 'Ошибка получения IP';
        }
    }

    async function startServer() {
        const repo = document.getElementById('repo').value;
        const token = document.getElementById('token').value;
        saveConfig();
        
        const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/mc.yml/dispatches`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({ ref: 'main', inputs: { action: 'start' } })
        });

        if (res.ok) {
            alert('🚀 Сигнал на запуск сервера отправлен! Подождите 1-2 минуты и нажмите "Обновить IP".');
        } else {
            alert('❌ Ошибка запуска. Проверьте Token и название репозитория.');
        }
    }

    async function sendCmd() {
        const repo = document.getElementById('repo').value;
        const token = document.getElementById('token').value;
        const cmd = document.getElementById('cmdInput').value;
        saveConfig();
        if (!cmd) return;

        // Создаем или обновляем файл command.txt в репозитории через GitHub API
        let sha = '';
        try {
            const fileRes = await fetch(`https://api.github.com/repos/${repo}/contents/command.txt`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (fileRes.ok) {
                const data = await fileRes.json();
                sha = data.sha;
            }
        } catch(e) {}

        const bodyData = {
            message: `Command: ${cmd}`,
            content: btoa(cmd),
            branch: 'main'
        };
        if (sha) bodyData.sha = sha;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/command.txt`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify(bodyData)
        });

        if (res.ok) {
            alert(`✅ Команда "${cmd}" отправлена на сервер!`);
            document.getElementById('cmdInput').value = '';
        } else {
            alert('❌ Ошибка отправки команды.');
        }
    }

    // Автопроверка IP при загрузке
    if (localStorage.getItem('mc_repo')) {
        fetchIp();
    }
</script>
</body>
</html>
