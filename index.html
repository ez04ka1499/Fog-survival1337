<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .status-box { display: flex; align-items: center; justify-content: space-between; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 8px; }
        .indicator.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        button.stop { background: #ef4444; color: white; }
        button.stop:hover { background: #dc2626; }
        input { width: 100%; background: #1e293b; border: 1px solid #475569; color: white; padding: 8px; border-radius: 4px; margin-top: 5px; box-sizing: border-box; }
        .ip-display { background: #334155; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 16px; word-break: break-all; margin-top: 5px; color: #38bdf8; font-weight: bold; text-align: center; border: 1px dashed #38bdf8; }
        .log-box { background: #000; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; height: 140px; overflow-y: auto; color: #22c55e; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Minecraft Server Panel</h1>

    <!-- Настройки доступа -->
    <div class="card">
        <h3>🔑 Настройки доступа</h3>
        <label>GitHub Token (repo, workflow):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" oninput="saveCredentials()">
        <label>Репозиторий:</label>
        <input type="text" id="repo" value="ez04ka1499/Fog-survival1337" oninput="saveCredentials()">
    </div>

    <!-- Статус и IP -->
    <div class="card">
        <div class="status-box">
            <div><span id="indicator" class="indicator"></span> Статус: <span id="status-text">Проверка...</span></div>
            <button onclick="checkStatus()" style="width: auto; margin:0; padding: 5px 10px;">Обновить</button>
        </div>
        <div style="margin-top: 12px;">
            <label>🌐 Актуальный IP для подключения:</label>
            <div id="server-ip" class="ip-display">Не запущен</div>
        </div>
    </div>

    <!-- Управление -->
    <div class="card">
        <h3>⚡ Управление сервером</h3>
        <button onclick="triggerWorkflow()">▶ Запустить сервер</button>
        <button class="stop" onclick="stopWorkflow()">⏹ Остановить и сохранить мир</button>
    </div>

    <!-- Загрузка модов -->
    <div class="card">
        <h3>📦 Загрузка модов (.jar)</h3>
        <input type="file" id="modFile" accept=".jar">
        <button onclick="uploadMod()">Загрузить мод в my_mods/</button>
        <div id="upload-status" style="font-size: 12px; margin-top: 5px; color: #38bdf8;"></div>
    </div>

    <!-- Логи -->
    <div class="card">
        <h3>📜 Логи туннеля и запуска</h3>
        <div id="logs" class="log-box">Ожидание обновления...</div>
    </div>
</div>

<script>
    window.onload = function() {
        if (localStorage.getItem('gh_token')) document.getElementById('token').value = localStorage.getItem('gh_token');
        if (localStorage.getItem('gh_repo')) document.getElementById('repo').value = localStorage.getItem('gh_repo');
        checkStatus();
    };

    function saveCredentials() {
        localStorage.setItem('gh_token', document.getElementById('token').value);
        localStorage.setItem('gh_repo', document.getElementById('repo').value);
    }

    async function apiRequest(endpoint, method = 'GET', data = null, isText = false) {
        const token = document.getElementById('token').value;
        const repo = document.getElementById('repo').value;
        if (!token || !repo) return null;

        const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' };
        const options = { method, headers };
        if (data) options.body = JSON.stringify(data);

        const response = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, options);
        if (!response.ok) return null;
        return isText ? await response.text() : (response.status !== 204 ? await response.json() : true);
    }

    async function checkStatus() {
        document.getElementById('status-text').innerText = 'Проверка...';
        const runsData = await apiRequest('actions/runs?per_page=1');
        if (!runsData || !runsData.workflow_runs.length) return;

        const run = runsData.workflow_runs[0];
        const statusText = document.getElementById('status-text');
        const indicator = document.getElementById('indicator');

        if (run.status === 'in_progress' || run.status === 'queued') {
            indicator.className = 'indicator online';
            statusText.innerText = run.status === 'queued' ? 'В очереди...' : 'Запущен (Работает)';
            fetchJobAndLogs(run.id);
        } else {
            indicator.className = 'indicator';
            statusText.innerText = `Остановлен (${run.conclusion || run.status})`;
            document.getElementById('server-ip').innerText = 'Сервер выключен';
            document.getElementById('logs').innerText = 'Сервер выключен. Нажмите «Запустить сервер».';
        }
    }

    async function fetchJobAndLogs(runId) {
        const jobsData = await apiRequest(`actions/runs/${runId}/jobs`);
        if (!jobsData || !jobsData.jobs.length) return;

        const job = jobsData.jobs[0];

        // Получаем сырой текст логов для поиска IP
        const rawLogs = await apiRequest(`actions/jobs/${job.id}/logs`, 'GET', null, true);
        if (rawLogs) {
            // Ищем строку SERVER_IP: в логах
            const ipMatch = rawLogs.match(/SERVER_IP:\s*([^\s]+)/i);

            if (ipMatch && ipMatch[1] && ipMatch[1] !== 'Инициализация...') {
                document.getElementById('server-ip').innerText = ipMatch[1];
            } else {
                document.getElementById('server-ip').innerText = 'Получение адреса туннеля...';
            }

            // Выводим последние строчки логов
            const logLines = rawLogs.split('\n');
            document.getElementById('logs').innerText = logLines.slice(-12).join('\n');
        }
    }

    async function triggerWorkflow() {
        if (!confirm('Запустить сервер Minecraft?')) return;
        const res = await apiRequest('actions/workflows/minecraft.yml/dispatches', 'POST', { ref: 'main' });
        if (res !== null) {
            alert('Команда отправлена! Сервер запускается.');
            setTimeout(checkStatus, 4000);
        }
    }

    async function stopWorkflow() {
        if (!confirm('Остановить сервер и сохранить мир?')) return;
        const runsData = await apiRequest('actions/runs?status=in_progress');
        if (!runsData || !runsData.workflow_runs.length) {
            alert('Запущенный сервер не найден.');
            return;
        }
        const res = await apiRequest(`actions/runs/${runsData.workflow_runs[0].id}/cancel`, 'POST');
        if (res !== null) {
            alert('Сигнал остановки отправлен. Идет автосохранение...');
            setTimeout(checkStatus, 4000);
        }
    }

    async function uploadMod() {
        const fileInput = document.getElementById('modFile');
        const statusDiv = document.getElementById('upload-status');
        if (!fileInput.files.length) return alert('Выберите .jar файл!');

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = async function(e) {
            const contentBase64 = e.target.result.split(',')[1];
            statusDiv.innerText = 'Загрузка мода...';
            const path = `my_mods/${file.name}`;

            let sha = null;
            const check = await apiRequest(`contents/${path}`);
            if (check && check.sha) sha = check.sha;

            const body = { message: `Upload mod ${file.name} [skip ci]`, content: contentBase64, ...(sha && { sha }) };
            const res = await apiRequest(`contents/${path}`, 'PUT', body);
            if (res) {
                statusDiv.innerText = `Успешно загружен: ${file.name}`;
                fileInput.value = '';
            } else statusDiv.innerText = 'Ошибка загрузки.';
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
