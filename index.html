<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .status-box { display: flex; align-items: center; justify-content: space-between; }
        .indicator { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 8px; }
        .indicator.online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        button.stop { background: #ef4444; color: white; }
        button.stop:hover { background: #dc2626; }
        input, textarea { width: 100%; background: #1e293b; border: 1px solid #475569; color: white; padding: 8px; border-radius: 4px; margin-top: 5px; box-sizing: border-box; }
        .ip-display { background: #334155; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 14px; word-break: break-all; margin-top: 5px; color: #38bdf8; }
        .log-box { background: #000; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 6px; height: 120px; overflow-y: auto; color: #22c55e; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Minecraft Server Panel</h1>

    <!-- Авторизация (Токен и репозиторий) -->
    <div class="card">
        <h3>🔑 Настройки доступа</h3>
        <label>GitHub Personal Access Token (repo, workflow):</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <label>Репозиторий (например: user/repo):</label>
        <input type="text" id="repo" placeholder="username/Fog-survival1337">
    </div>

    <!-- Статус и IP -->
    <div class="card">
        <div class="status-box">
            <div><span id="indicator" class="indicator"></span> Статус: <span id="status-text">Проверка...</span></div>
            <button onclick="checkStatus()" style="width: auto; margin:0; padding: 5px 10px;">Обновить</button>
        </div>
        <div style="margin-top: 10px;">
            <label>🌐 Актуальный IP / Домен туннеля:</label>
            <div id="server-ip" class="ip-display">Не запущен / Ищем в логах...</div>
        </div>
    </div>

    <!-- Управление -->
    <div class="card">
        <h3>⚡ Управление сервером</h3>
        <button onclick="triggerWorkflow('true')">▶ Запустить сервер</button>
        <button class="stop" onclick="stopWorkflow()">⏹ Остановить и сохранить мир</button>
    </div>

    <!-- Загрузка модов -->
    <div class="card">
        <h3>📦 Загрузка модов (.jar)</h3>
        <input type="file" id="modFile" accept=".jar">
        <button onclick="uploadMod()">Загрузить мод в репозиторий</button>
        <div id="upload-status" style="font-size: 12px; margin-top: 5px; color: #38bdf8;"></div>
    </div>

    <!-- Логи последней сессии -->
    <div class="card">
        <h3>📜 Логи / Статус туннеля</h3>
        <div id="logs" class="log-box">Нажмите «Обновить», чтобы загрузить информацию...</div>
    </div>
</div>

<script>
    async function apiRequest(endpoint, method = 'GET', data = null) {
        const token = document.getElementById('token').value;
        const repo = document.getElementById('repo').value;
        if (!token || !repo) {
            alert('Введите GitHub Token и имя репозитория!');
            return null;
        }

        const headers = {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json'
        };

        const options = { method, headers };
        if (data) options.body = JSON.stringify(data);

        const response = await fetch(`https://api.github.com/repos/${repo}/${endpoint}`, options);
        if (!response.ok) {
            const err = await response.json();
            alert('Ошибка GitHub API: ' + (err.message || response.statusText));
            return null;
        }
        return response.status !== 204 ? await response.json() : true;
    }

    async function checkStatus() {
        document.getElementById('status-text').innerText = 'Проверка...';
        const runsData = await apiRequest('actions/runs?per_page=1');
        if (!runsData || !runsData.workflow_runs.length) return;

        const run = runsData.workflow_runs[0];
        const statusText = document.getElementById('status-text');
        const indicator = document.getElementById('indicator');

        if (run.status === 'in_progress') {
            indicator.className = 'indicator online';
            statusText.innerText = 'Сервер запущен (Работает)';
            
            // Пытаемся найти IP туннеля в логах шагов
            fetchLogs(run.id);
        } else {
            indicator.className = 'indicator';
            statusText.innerText = `Остановлен (${run.conclusion || run.status})`;
            document.getElementById('server-ip').innerText = 'Сервер выключен';
        }
    }

    async function fetchLogs(runId) {
        const token = document.getElementById('token').value;
        const repo = document.getElementById('repo').value;
        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${runId}/jobs`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.jobs && data.jobs.length > 0) {
                document.getElementById('logs').innerText = `Текущий этап: ${data.jobs[0].name} — Статус: ${data.jobs[0].status}`;
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function triggerWorkflow() {
        if (!confirm('Запустить сервер на GitHub Actions?')) return;
        // Ищем ID нашего workflow или диспатчим по названию файла
        const res = await apiRequest('actions/workflows/minecraft.yml/dispatches', 'POST', { ref: 'main' });
        if (res !== null) {
            alert('Команда на запуск отправлена! Подождите 1-2 минуты.');
            setTimeout(checkStatus, 5000);
        }
    }

    async function stopWorkflow() {
        if (!confirm('Остановить сервер и сохранить мир?')) return;
        const runsData = await apiRequest('actions/runs?status=in_progress');
        if (!runsData || !runsData.workflow_runs.length) {
            alert('Активных запущенных серверов не найдено.');
            return;
        }
        const runId = runsData.workflow_runs[0].id;
        const res = await apiRequest(`actions/runs/${runId}/cancel`, 'POST');
        if (res !== null) {
            alert('Сигнал остановки отправлен. Мир сохраняется в репозиторий.');
            setTimeout(checkStatus, 5000);
        }
    }

    async function uploadMod() {
        const fileInput = document.getElementById('modFile');
        const statusDiv = document.getElementById('upload-status');
        if (!fileInput.files.length) {
            alert('Выберите файл мода (.jar)!');
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = async function(e) {
            const contentBase64 = e.target.result.split(',')[1];
            statusDiv.innerText = 'Загрузка мода в репозиторий...';

            const path = `my_mods/${file.name}`;
            const token = document.getElementById('token').value;
            const repo = document.getElementById('repo').value;

            // Проверяем, существует ли файл (нужен ли sha для апдейта)
            let sha = null;
            const check = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (check.ok) {
                const fileData = await check.json();
                sha = fileData.sha;
            }

            const body = {
                message: `Add mod ${file.name} via web panel [skip ci]`,
                content: contentBase64,
                ...(sha && { sha })
            };

            const res = await apiRequest(`contents/${path}`, 'PUT', body);
            if (res) {
                statusDiv.innerText = `Успешно! Мод ${file.name} добавлен.`;
                fileInput.value = '';
            } else {
                statusDiv.innerText = 'Ошибка загрузки мода.';
            }
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
