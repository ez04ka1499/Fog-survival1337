name: Minecraft Forge Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Command or Action'
        required: true
        default: 'start'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Git Identity
        run: |
          git config --global user.name "MC Bot"
          git config --global user.email "bot@github.com"

      - name: Prepare Forge 1.20.1 Server Environment
        run: |
          mkdir server
          cd server
          echo "eula=true" > eula.txt
          
          if [ ! -f "run.sh" ]; then
            curl -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar
            java -jar installer.jar --installServer
            rm installer.jar
          fi

      - name: Start Minecraft Server & Tunnel
        run: |
          cd server
          mkfifo mc_pipe
          
          # Запуск сервера в фоне
          sh run.sh nogui < mc_pipe > ../server.log 2>&1 &
          
          echo "Ожидание запуска сервера..."
          
          # Умный цикл ожидания готовности сервера
          for i in {1..45}; do
            if grep -q "Done (" ../server.log; then
              echo "Сервер успешно запущен!"
              break
            fi
            sleep 3
          done

          echo "Поднимаем публичный TCP-туннель через Pinggy..."
          # Запуск туннеля Pinggy для порта 25565
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:25565 tcp@free.pinggy.io > ../tunnel.log 2>&1 &
          
          sleep 8
          
          echo "=== СОДЕРЖИМОЕ ЛОГА ТУННЕЛЯ ==="
          cat ../tunnel.log
          echo "================================"

          # Извлекаем честный публичный URL (начинается с tcp://)
          TUNNEL_URL=$(grep -o 'tcp://[a-zA-Z0-9.-]*:[0-9]*' ../tunnel.log | head -n 1 || echo "")

          echo "$TUNNEL_URL" > ../tunnel.txt
          echo "Полученный публичный адрес: $TUNNEL_URL"

          git add ../tunnel.txt
          git commit -m "Update server tunnel address [skip ci]" || true
          git push || true

          # Цикл приема команд с сайта
          while true; do
            if [ -f ../command.txt ]; then
              CMD=$(cat ../command.txt)
              rm ../command.txt
              
              if [ "$CMD" == "STOP" ]; then
                echo "stop" > mc_pipe
                break
              fi
              
              echo "Выполняю команду: $CMD"
              echo "$CMD" > mc_pipe
            fi
            sleep 3
          done
