name: Minecraft Forge 1.20.1 Server

on:
  workflow_dispatch:

env:
  FORGE_VERSION: "1.20.1-47.3.0"
  JAVA_VERSION: "17"

jobs:
  start-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 🧹 Очистка места
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          mkdir -p server/mods
          
      - name: ☕ Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: ⬇️ Скачивание Forge Installer
        run: |
          wget -q "https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-installer.jar"
          
      - name: 🔨 Установка Forge Server
        run: java -jar forge-*-installer.jar --installServer --no-user-input
        
      - name: 🌐 Установка e4mc
        run: |
          E4MC_URL=$(curl -s https://api.modrinth.com/v2/project/e4mc/version?game_versions=["1.20.1"]&loaders=["forge"] | jq -r '.[0].files[0].url')
          echo "Скачивание e4mc: $E4MC_URL"
          wget -q "$E4MC_URL" -O server/mods/e4mc.jar
          
      - name: ⚡ Установка модов оптимизации
        run: |
          download_mod() {
            local slug=$1
            local url=$(curl -s "https://api.modrinth.com/v2/project/$slug/version?game_versions=[\"1.20.1\"]&loaders=[\"forge\"]" | jq -r '.[0].files[0].url')
            if [ "$url" != "null" ] && [ -n "$url" ]; then
              wget -q "$url" -P server/mods/
              echo "✅ Установлен: $slug"
            else
              echo "❌ Не найден: $slug"
            fi
          }
          
          download_mod "modernfix"
          download_mod "ferritecore"
          download_mod "embeddium"
          download_mod "entityculling"
          download_mod "spark"
          download_mod "krypton-reforged"
          
      - name: ⚙️ Создание server.properties
        run: |
          cat <<EOF > server/server.properties
          server-port=25565
          online-mode=false
          enable-status=true
          max-tick-time=-1
          network-compression-threshold=256
          simulation-distance=8
          view-distance=10
          sync-chunk-writes=false
          use-native-transport=true
          EOF
          
      - name: 👑 Настройка операторов (TWIX_EXTRATOP)
        run: |
          mkdir -p server/world
          echo "TWIX_EXTRATOP" > server/ops.json
          cat <<EOF > server/ops.json
          [
            {
              "uuid": "",
              "name": "TWIX_EXTRATOP",
              "level": 4,
              "bypassesPlayerLimit": false
            }
          ]
          EOF
          
      - name: 📜 Принятие EULA
        run: echo "eula=true" > server/eula.txt
        
      - name: 🚀 Запуск сервера
        working-directory: ./server
        run: |
          echo "=== ЗАПУСК СЕРВЕРА ==="
          echo "Игрок TWIX_EXTRATOP получит права оператора автоматически"
          echo "После появления ссылки e4mc скопируйте её для подключения!"
          
          java -Xms6G -Xmx6G \
            -XX:+UseZGC \
            -XX:+ZGenerational \
            -XX:+AlwaysPreTouch \
            -XX:+DisableExplicitGC \
            -XX:+UnlockExperimentalVMOptions \
            -XX:ZCollectionInterval=5 \
            -XX:ZAllocationSpikeTolerance=5 \
            -Dfml.queryResult=confirm \
            -Dterminal.jline=false \
            -Dterminal.ansi=true \
            @user_jvm_args.txt @libraries/net/minecraftforge/forge/1.20.1-47.3.0/unix_args.txt nogui
