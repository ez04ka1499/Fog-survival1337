name: Minecraft Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Command or Action'
        required: true
        default: 'start'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Git Identity
        run: |
          git config --global user.name "MC Bot"
          git config --global user.email "bot@github.com"

      - name: Prepare Server Environment
        run: |
          mkdir server
          cd server
          echo "eula=true" > eula.txt
          
          # Надежное скачивание актуальной версии PaperMC через Python API запрос
          python3 -c '
          import urllib.request, json
          url = "https://api.papermc.io/v2/projects/paper/versions/1.20.4"
          data = json.loads(urllib.request.urlopen(url).read().decode())
          latest_build = data["builds"][-1]
          jar_name = f"paper-1.20.4-{latest_build}.jar"
          jar_url = f"https://api.papermc.io/v2/projects/paper/versions/1.20.4/builds/{latest_build}/downloads/{jar_name}"
          print("Скачиваем сервер по адресу:", jar_url)
          urllib.request.urlretrieve(jar_url, "server.jar")
          '

      - name: Start Minecraft Server & Tunnel
        run: |
          cd server
          
          # Создаем FIFO пайп для управления консолью
          mkfifo mc_pipe
          
          # Запуск сервера в фоне
          java -Xmx3G -Xms1G -jar server.jar nogui < mc_pipe &
          
          echo "Сервер запущен, ждем инициализацию мира..."
          sleep 35

          # Запуск SSH TCP-туннеля (Serveo)
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 serveo.net > ../tunnel.log 2>&1 &
          
          sleep 5
          
          # Вытаскиваем адрес туннеля и сохраняем
          TUNNEL_URL=$(grep -o 'serveo.net:[0-9]*' ../tunnel.log | head -n 1 || echo "Ожидание туннеля...")
          echo "$TUNNEL_URL" > ../tunnel.txt
          
          git add ../tunnel.txt
          git commit -m "Update server tunnel address [skip ci]" || true
          git push || true

          # Цикл обработки команд
          while true; do
            if [ -f ../command.txt ]; then
              CMD=$(cat ../command.txt)
              rm ../command.txt
              
              if [ "$CMD" == "STOP" ]; then
                echo "stop" > mc_pipe
                break
              fi
              
              echo "Выполняю команду: $CMD"
              echo "$CMD" > mc_pipe
            fi
            sleep 3
          done
