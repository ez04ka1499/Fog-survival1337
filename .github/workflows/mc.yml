name: Minecraft Forge Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Command or Action'
        required: true
        default: 'start'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Required for Forge 1.20.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Git Identity
        run: |
          git config --global user.name "MC Bot"
          git config --global user.email "bot@github.com"

      - name: Prepare Forge 1.20.1 Server Environment
        run: |
          mkdir server
          cd server
          echo "eula=true" > eula.txt
          
          # Скачиваем установщик Forge 1.20.1 (версия 47.2.0)
          curl -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar
          
          # Устанавливаем сервер
          java -jar installer.jar --installServer
          
          rm installer.jar

      - name: Start Minecraft Server & Tunnel
        run: |
          cd server
          
          # Создаем FIFO пайп для управления консолью
          mkfifo mc_pipe
          
          # Надежный запуск Forge сервера через универсальный jar-файл библиотек
          java -Xmx3G -Xms1G -jar libraries/net/minecraftforge/forge/1.20.1-47.2.0/win_server/forge-1.20.1-47.2.0-server.jar nogui < mc_pipe &
          
          echo "Сервер Forge запускается, ждем инициализацию мира..."
          sleep 50

          # Запуск SSH TCP-туннеля (Serveo)
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 serveo.net > ../tunnel.log 2>&1 &
          
          sleep 5
          
          # Вытаскиваем адрес туннеля и сохраняем
          TUNNEL_URL=$(grep -o 'serveo.net:[0-9]*' ../tunnel.log | head -n 1 || echo "Ожидание туннеля...")
          echo "$TUNNEL_URL" > ../tunnel.txt
          
          git add ../tunnel.txt
          git commit -m "Update server tunnel address [skip ci]" || true
          git push || true

          # Цикл обработки команд из консоли сайта
          while true; do
            if [ -f ../command.txt ]; then
              CMD=$(cat ../command.txt)
              rm ../command.txt
              
              if [ "$CMD" == "STOP" ]; then
                echo "stop" > mc_pipe
                break
              fi
              
              echo "Выполняю команду: $CMD"
              echo "$CMD" > mc_pipe
            fi
            sleep 3
          done
