name: Minecraft Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Command or Action'
        required: true
        default: 'start'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Максимальное время работы (6 часов)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Git Identity
        run: |
          git config --global user.name "MC Bot"
          git config --global user.email "bot@github.com"

      - name: Prepare Server Environment
        run: |
          mkdir server
          cd server
          echo "eula=true" > eula.txt
          
          # Скачиваем PaperMC 1.20.4 (можно изменить версию при желании)
          curl -o server.jar https://api.papermc.io/v2/projects/paper/versions/1.20.4/builds/498/downloads/paper-1.20.4-498.jar

      - name: Start Minecraft Server & Tunnel
        run: |
          cd server
          
          # Создаем FIFO пайп для управления консолью сервера из файлов
          mkfifo mc_pipe
          
          # Запуск сервера в фоне с подключением к пайпу
          java -Xmx3G -Xms1G -jar server.jar nogui < mc_pipe &
          
          echo "Сервер запущен, ждем инициализацию..."
          sleep 25

          # Запуск нативного SSH TCP-туннеля (Serveo) для порта 25565
          # Туннель работает на самом сервере GitHub Actions
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 serveo.net > ../tunnel.log 2>&1 &
          
          sleep 5
          
          # Вытаскиваем адрес туннеля из логов и записываем в файл для index.html
          TUNNEL_URL=$(grep -o 'serveo.net:[0-9]*' ../tunnel.log | head -n 1 || echo "Ожидание туннеля...")
          echo "$TUNNEL_URL" > ../tunnel.txt
          
          git add ../tunnel.txt
          git commit -m "Update server tunnel address [skip ci]" || true
          git push || true

          # Цикл обработки команд из файла command.txt и поддержания жизни сервера
          while true; do
            if [ -f ../command.txt ]; then
              CMD=$(cat ../command.txt)
              rm ../command.txt
              
              if [ "$CMD" == "STOP" ]; then
                echo "stop" > mc_pipe
                break
              fi
              
              echo "Выполняю команду: $CMD"
              echo "$CMD" > mc_pipe
            fi
            sleep 3
          done
