name: Forge 1.20.1 Minecraft Server

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Сколько минут держать сервер"
        required: true
        default: "120"
        type: string

      max_players:
        description: "Максимум игроков"
        required: true
        default: "5"
        type: string

      view_distance:
        description: "View distance (4-12; меньше = меньше нагрузки)"
        required: true
        default: "6"
        type: string

      simulation_distance:
        description: "Simulation distance (4-10)"
        required: true
        default: "5"
        type: string

      motd:
        description: "Сообщение в списке серверов"
        required: true
        default: "GitHub Forge 1.20.1 Server"
        type: string

      admin_nickname:
        description: "Ник администратора"
        required: true
        default: "TWIX_EXTRATOP"
        type: string

      memory_gb:
        description: "ОЗУ для Minecraft, GB"
        required: true
        default: "6"
        type: string

concurrency:
  group: minecraft-server
  cancel-in-progress: true

env:
  MC_VERSION: "1.20.1"
  FORGE_VERSION: "47.3.0"
  SERVER_DIR: server
  WORLD_BACKUP_DIR: world_backup

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create server directory
        run: mkdir -p ${{ env.SERVER_DIR }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Forge server
        id: forge-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SERVER_DIR }}/libraries
            ${{ env.SERVER_DIR }}/minecraft_server-${{ env.MC_VERSION }}.jar
            ${{ env.SERVER_DIR }}/run.sh
          key: forge-${{ env.MC_VERSION }}-${{ env.FORGE_VERSION }}-v2

      - name: Install Forge server
        if: steps.forge-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -euo pipefail

          FORGE_FULL="${MC_VERSION}-${FORGE_VERSION}"
          INSTALLER="forge-${FORGE_FULL}-installer.jar"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$INSTALLER" \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_FULL}/${INSTALLER}"

          java -jar "$INSTALLER" --installServer

          echo "eula=true" > eula.txt

      - name: Configure server
        working-directory: ${{ env.SERVER_DIR }}
        env:
          MAX_PLAYERS: ${{ github.event.inputs.max_players }}
          VIEW_DISTANCE: ${{ github.event.inputs.view_distance }}
          SIMULATION_DISTANCE: ${{ github.event.inputs.simulation_distance }}
          MOTD: ${{ github.event.inputs.motd }}
          ADMIN: ${{ github.event.inputs.admin_nickname }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb }}
        run: |
          set -euo pipefail
          mkdir -p mods config

          # Aikar flags: уменьшают фризы, но НЕ пинг
          MEM="${MEMORY_GB}"
          cat > user_jvm_args.txt <<EOF
          -Xms${MEM}G
          -Xmx${MEM}G
          -XX:+UseG1GC
          -XX:+ParallelRefProcEnabled
          -XX:MaxGCPauseMillis=200
          -XX:+UnlockExperimentalVMOptions
          -XX:+DisableExplicitGC
          -XX:+AlwaysPreTouch
          -XX:G1NewSizePercent=30
          -XX:G1MaxNewSizePercent=40
          -XX:G1HeapRegionSize=8M
          -XX:G1ReservePercent=20
          -XX:G1HeapWastePercent=5
          -XX:G1MixedGCCountTarget=4
          -XX:InitiatingHeapOccupancyPercent=15
          -XX:G1MixedGCLiveThresholdPercent=90
          -XX:G1RSetUpdatingPauseTimePercent=5
          -XX:SurvivorRatio=32
          -XX:+PerfDisableSharedMem
          -XX:MaxTenuringThreshold=1
          -Dusing.aikars.flags=https://mcflags.emc.gs
          -Daikars.new.flags=true
          EOF

          cat > server.properties <<EOF
          online-mode=false
          max-players=${MAX_PLAYERS}
          view-distance=${VIEW_DISTANCE}
          simulation-distance=${SIMULATION_DISTANCE}
          motd=${MOTD}
          spawn-protection=0
          enable-command-block=true
          enable-status=true
          network-compression-threshold=256
          sync-chunk-writes=false
          max-tick-time=60000
          player-idle-timeout=0
          prevent-proxy-connections=false
          enforce-secure-profile=false
          op-permission-level=4
          EOF

          # Offline-mode UUID для ника администратора
          ADMIN_UUID=$(python3 - <<'PY'
          import uuid
          import hashlib

          name = "${ADMIN}"
          data = b"OfflinePlayer:" + name.encode("utf-8")
          md5_hash = hashlib.md5(data).digest()
          byte_array = bytearray(md5_hash)
          byte_array[6] = (byte_array[6] & 0x0F) | 0x30
          byte_array[8] = (byte_array[8] & 0x3F) | 0x80
          print(str(uuid.UUID(bytes=bytes(byte_array))))
          PY
          )

          cat > ops.json <<EOF
          [
            {
              "uuid": "${ADMIN_UUID}",
              "name": "${ADMIN}",
              "level": 4,
              "bypassesPlayerLimit": true
            }
          ]
          EOF

          echo "Admin: ${ADMIN}"
          echo "Admin UUID: ${ADMIN_UUID}"

      - name: Download e4mc mod
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -euo pipefail

          URL=$(curl -fsSL \
            "https://api.modrinth.com/v2/project/e4mc/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" \
            | jq -r '.[0].files[0].url')

          curl -fL --retry 3 --retry-delay 2 -o mods/e4mc.jar "$URL"

      - name: Copy custom mods
        run: |
          set -euo pipefail

          if [ -d my_mods ]; then
            find my_mods -type f -name "*.jar" \
              -exec cp -v {} "${{ env.SERVER_DIR }}/mods/" \;
          fi

      - name: Restore world backup
        run: |
          set -euo pipefail

          if [ -d "$WORLD_BACKUP_DIR" ]; then
            rm -rf "${{ env.SERVER_DIR }}/world"
            mkdir -p "${{ env.SERVER_DIR }}/world"
            cp -a "$WORLD_BACKUP_DIR/." "${{ env.SERVER_DIR }}/world/"
          fi

      - name: Start Forge server
        working-directory: ${{ env.SERVER_DIR }}
        env:
          RUNTIME_MINUTES: ${{ github.event.inputs.runtime_minutes }}
        run: |
          set +e
          chmod +x run.sh

          timeout "${RUNTIME_MINUTES}m" ./run.sh nogui
          EXIT_CODE=$?

          echo "SERVER_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"
          exit 0

      - name: Save world backup
        if: always()
        run: |
          set -euo pipefail

          if [ ! -d "${{ env.SERVER_DIR }}/world" ]; then
            echo "No world directory."
            exit 0
          fi

          rm -rf "$WORLD_BACKUP_DIR"
          mkdir -p "$WORLD_BACKUP_DIR"
          cp -a "${{ env.SERVER_DIR }}/world/." "$WORLD_BACKUP_DIR/"

          if [ -z "$(git status --porcelain -- "$WORLD_BACKUP_DIR")" ]; then
            echo "No world changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$WORLD_BACKUP_DIR"
          git commit -m "chore: backup Minecraft world [skip ci]"
          git push
