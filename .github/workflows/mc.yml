name: Minecraft Forge Server

on:
  workflow_dispatch:
    inputs:
      memory:
        description: "Память Minecraft"
        type: choice
        options:
          - 3G
          - 4G
          - 6G
        default: 4G

      view_distance:
        description: "View distance"
        default: "6"

      simulation_distance:
        description: "Simulation distance"
        default: "4"

      online_mode:
        description: "Проверка лицензий"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"

      difficulty:
        description: "Сложность"
        type: choice
        options:
          - peaceful
          - easy
          - normal
          - hard
        default: normal

      max_players:
        description: "Игроков"
        default: "10"

      motd:
        description: "Описание сервера"
        default: "Fog Survival"

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      MC_MEMORY: ${{ inputs.memory }}
      MC_VIEW: ${{ inputs.view_distance }}
      MC_SIM: ${{ inputs.simulation_distance }}
      MC_ONLINE: ${{ inputs.online_mode }}
      MC_DIFFICULTY: ${{ inputs.difficulty }}
      MC_PLAYERS: ${{ inputs.max_players }}
      MC_MOTD: ${{ inputs.motd }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш установки Forge и модов
        uses: actions/cache@v4
        with:
          path: |
            server/libraries
            server/run.sh
            server/mods
          key: forge-1.20.1-47.2.0-e4mc-v4

      - name: Установка Forge
        run: |
          set -euo pipefail
          mkdir -p server/mods
          cd server

          ARGS="libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt"

          if [ ! -f run.sh ] || [ ! -f "$ARGS" ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar

            java -jar installer.jar --installServer
            rm -f installer.jar
          fi

          test -f run.sh
          test -f "$ARGS"

      - name: Установка мода e4mc для туннеля
        run: |
          set -euo pipefail
          cd server/mods
          rm -f e4mc*.jar e4all*.jar
          
          echo "Получаем актуальную ссылку на мод через Modrinth API..."
          DOWNLOAD_URL=$(curl -s "https://api.modrinth.com/v2/project/fB1gJLGX/version?loaders=%5B%22forge%22%5D&game_versions=%5B%221.20.1%22%5D" | jq -r '.[0].files[0].url')
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::Не удалось найти версию мода для Forge 1.20.1"
            exit 1
          fi
          
          echo "Скачиваем: $DOWNLOAD_URL"
          curl -fL --retry 5 -o e4mc.jar "$DOWNLOAD_URL"

      - name: Настройки сервера
        run: |
          set -euo pipefail

          cd server
          echo "eula=true" > eula.txt

          cat > user_jvm_args.txt <<EOF
          -Xms1G
          -Xmx${MC_MEMORY}
          -XX:+UseG1GC
          -XX:MaxGCPauseMillis=200
          -XX:+ParallelRefProcEnabled
          -XX:+UnlockExperimentalVMOptions
          -XX:G1NewSizePercent=30
          -XX:G1MaxNewSizePercent=40
          -XX:G1HeapRegionSize=8M
          -XX:InitiatingHeapOccupancyPercent=15
          EOF

          cat > server.properties <<EOF
          server-port=25565
          online-mode=${MC_ONLINE}
          difficulty=${MC_DIFFICULTY}
          max-players=${MC_PLAYERS}
          view-distance=${MC_VIEW}
          simulation-distance=${MC_SIM}
          motd=${MC_MOTD}
          sync-chunk-writes=false
          spawn-protection=0
          enable-command-block=true
          EOF

      - name: Запуск Minecraft и e4mc туннеля
        run: |
          set -euo pipefail

          cd server

          rm -f mc_pipe
          mkfifo mc_pipe

          # Открываем FIFO с обеих сторон, чтобы Java не зависла.
          exec 3<>mc_pipe

          bash run.sh nogui <&3 > ../server.log 2>&1 &
          SERVER_PID=$!

          echo "Ждём запуск Minecraft и генерацию ссылки e4mc..."
          READY=false
          ADDRESS=""

          for i in $(seq 1 140); do
            if grep -q "Done (" ../server.log; then
              READY=true
            fi

            if grep -qE '[a-zA-Z0-9-]+\.e4mc\.link' ../server.log; then
              ADDRESS=$(grep -oE '[a-zA-Z0-9-]+\.e4mc\.link' ../server.log | tail -n 1)
              if [ -n "$ADDRESS" ]; then
                break
              fi
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Minecraft упал при запуске"
              tail -n 160 ../server.log
              exit 1
            fi

            sleep 3
          done

          if [ -z "$ADDRESS" ]; then
            echo "::error::Не удалось получить адрес e4mc. Проверьте логи."
            tail -n 160 ../server.log
            exit 1
          fi

          echo "Адрес сервера: $ADDRESS"

          CONTENT=$(printf '%s' "$ADDRESS" | base64 -w0)
          SHA=$(gh api "repos/$REPO/contents/tunnel.txt?ref=$BRANCH" --jq .sha 2>/dev/null || true)

          if [ -n "$SHA" ]; then
            jq -n --arg c "$CONTENT" --arg s "$SHA" \
              '{message:"Update MC address [skip ci]",content:$c,branch:env.BRANCH,sha:$s}' \
              > /tmp/body.json
          else
            jq -n --arg c "$CONTENT" \
              '{message:"Update MC address [skip ci]",content:$c,branch:env.BRANCH}' \
              > /tmp/body.json
          fi

          gh api -X PUT "repos/$REPO/contents/tunnel.txt" \
            --input /tmp/body.json >/dev/null

          echo "$ADDRESS" > ../tunnel.txt

          while kill -0 "$SERVER_PID" 2>/dev/null; do
            sleep 5
          done

          echo "Minecraft остановлен."

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-logs-${{ github.run_id }}
          path: |
            server.log
            server/logs/latest.log
          if-no-files-found: ignore
          retention-days: 3
