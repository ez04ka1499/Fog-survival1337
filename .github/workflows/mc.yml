name: Minecraft Forge Server

on:
  workflow_dispatch:
    inputs:
      memory:
        description: "Память Minecraft"
        type: choice
        options:
          - 3G
          - 4G
          - 6G
        default: 4G

      view_distance:
        description: "View distance"
        default: "6"

      simulation_distance:
        description: "Simulation distance"
        default: "4"

      online_mode:
        description: "Проверка лицензий"
        type: choice
        options:
          - "true"
          - "false"
        default: "false"

      difficulty:
        description: "Сложность"
        type: choice
        options:
          - peaceful
          - easy
          - normal
          - hard
        default: normal

      max_players:
        description: "Игроков"
        default: "10"

      motd:
        description: "Описание сервера"
        default: "Fog Survival"

permissions:
  contents: write

concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      MC_MEMORY: ${{ inputs.memory }}
      MC_VIEW: ${{ inputs.view_distance }}
      MC_SIM: ${{ inputs.simulation_distance }}
      MC_ONLINE: ${{ inputs.online_mode }}
      MC_DIFFICULTY: ${{ inputs.difficulty }}
      MC_PLAYERS: ${{ inputs.max_players }}
      MC_MOTD: ${{ inputs.motd }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш установки Forge
        uses: actions/cache@v4
        with:
          path: |
            server/libraries
            server/run.sh
          key: forge-1.20.1-47.2.0-v6

      - name: Установка Forge
        run: |
          set -euo pipefail
          mkdir -p server
          cd server

          ARGS="libraries/net/minecraftforge/forge/1.20.1-47.2.0/unix_args.txt"

          if [ ! -f run.sh ] || [ ! -f "$ARGS" ]; then
            curl -fL --retry 5 -o installer.jar \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar

            java -jar installer.jar --installServer
            rm -f installer.jar
          fi

          test -f run.sh
          test -f "$ARGS"

      - name: Настройки сервера
        run: |
          set -euo pipefail

          cd server
          echo "eula=true" > eula.txt

          cat > user_jvm_args.txt <<EOF
          -Xms1G
          -Xmx${MC_MEMORY}
          -XX:+UseG1GC
          -XX:MaxGCPauseMillis=200
          -XX:+ParallelRefProcEnabled
          EOF

          cat > server.properties <<EOF
          server-port=25565
          online-mode=${MC_ONLINE}
          difficulty=${MC_DIFFICULTY}
          max-players=${MC_PLAYERS}
          view-distance=${MC_VIEW}
          simulation-distance=${MC_SIM}
          motd=${MC_MOTD}
          sync-chunk-writes=false
          spawn-protection=0
          enable-command-block=true
          EOF

           - name: Установка bore
        run: |
          set -euo pipefail

          # Берём ссылку на актуальный Linux-бинарник из GitHub Releases.
          BORE_URL=$(curl -fsSL \
            https://api.github.com/repos/ekzhang/bore/releases/latest \
            | jq -r '.assets[]
                | select(.name | test("x86_64-unknown-linux-musl\\.tar\\.gz$"))
                | .browser_download_url' \
            | head -n 1)

          if [ -z "$BORE_URL" ]; then
            echo "::error::Не удалось найти bore для Linux x86_64"
            exit 1
          fi

          echo "Скачиваю: $BORE_URL"

          curl -fL --retry 5 --retry-delay 3 \
            -o /tmp/bore.tar.gz \
            "$BORE_URL"

          mkdir -p /tmp/bore
          tar -xzf /tmp/bore.tar.gz -C /tmp/bore

          BORE_BIN=$(find /tmp/bore -type f -name bore | head -n 1)

          if [ -z "$BORE_BIN" ]; then
            echo "::error::В архиве не найден файл bore"
            find /tmp/bore -maxdepth 3 -type f
            exit 1
          fi

          sudo install "$BORE_BIN" /usr/local/bin/bore
          bore --version

      - name: Запуск Minecraft и bore
        run: |
          set -euo pipefail

          cd server

          rm -f mc_pipe
          mkfifo mc_pipe

          # Открываем FIFO с обеих сторон, чтобы Java не зависла.
          exec 3<>mc_pipe

          bash run.sh nogui <&3 > ../server.log 2>&1 &
          SERVER_PID=$!

          echo "Ждём Minecraft..."
          READY=false

          for i in $(seq 1 120); do
            if grep -q "Done (" ../server.log; then
              READY=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::Minecraft упал при запуске"
              tail -n 160 ../server.log
              exit 1
            fi

            sleep 3
          done

          if [ "$READY" != true ]; then
            echo "::error::Minecraft не запустился за 6 минут"
            tail -n 160 ../server.log
            exit 1
          fi

          echo "Minecraft запущен. Поднимаю bore.pub..."

          bore local 25565 --to bore.pub > ../bore.log 2>&1 &
          BORE_PID=$!

          sleep 5

          if ! kill -0 "$BORE_PID" 2>/dev/null; then
            echo "::error::bore не запустился"
            cat ../bore.log || true
            exit 1
          fi

          ADDRESS=$(grep -oE 'bore\.pub:[0-9]+' ../bore.log | head -n 1 || true)

          if [ -z "$ADDRESS" ]; then
            echo "::error::Не удалось получить адрес bore.pub"
            cat ../bore.log || true
            exit 1
          fi

          echo "Адрес сервера: $ADDRESS"

          # Пишем адрес для HTML-панели.
          CONTENT=$(printf '%s' "$ADDRESS" | base64 -w0)
          SHA=$(gh api "repos/$REPO/contents/tunnel.txt?ref=$BRANCH" --jq .sha 2>/dev/null || true)

          if [ -n "$SHA" ]; then
            jq -n --arg c "$CONTENT" --arg s "$SHA" \
              '{message:"Update MC address [skip ci]",content:$c,branch:env.BRANCH,sha:$s}' \
              > /tmp/body.json
          else
            jq -n --arg c "$CONTENT" \
              '{message:"Update MC address [skip ci]",content:$c,branch:env.BRANCH}' \
              > /tmp/body.json
          fi

          gh api -X PUT "repos/$REPO/contents/tunnel.txt" \
            --input /tmp/body.json >/dev/null

          echo "$ADDRESS" > ../tunnel.txt

          # Ждём остановки сервера.
          while kill -0 "$SERVER_PID" 2>/dev/null; do
            sleep 5
          done

          echo "Minecraft остановлен."

      - name: Логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-logs-${{ github.run_id }}
          path: |
            server.log
            bore.log
            server/logs/latest.log
          if-no-files-found: ignore
          retention-days: 3
