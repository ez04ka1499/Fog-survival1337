name: Forge 1.20.1 Optimized Server

on:
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Сколько минут держать сервер"
        required: true
        default: "180"
        type: string

      max_players:
        description: "Максимум игроков"
        required: true
        default: "5"
        type: string

      view_distance:
        description: "View distance (4-12; меньше = меньше нагрузки)"
        required: true
        default: "6"
        type: string

      simulation_distance:
        description: "Simulation distance (4-10)"
        required: true
        default: "5"
        type: string

      motd:
        description: "Сообщение в списке серверов"
        required: true
        default: "Optimized GitHub Forge 1.20.1"
        type: string

      admin_nickname:
        description: "Ник администратора"
        required: true
        default: "TWIX_EXTRATOP"
        type: string

      memory_gb:
        description: "ОЗУ для Minecraft, GB"
        required: true
        default: "6"
        type: string

concurrency:
  group: minecraft-server
  cancel-in-progress: true

env:
  MC_VERSION: "1.20.1"
  FORGE_VERSION: "47.3.0"
  SERVER_DIR: server
  WORLD_BACKUP_DIR: world_backup

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create directories
        run: mkdir -p ${{ env.SERVER_DIR }} my_mods

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Forge server
        id: forge-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SERVER_DIR }}/libraries
            ${{ env.SERVER_DIR }}/minecraft_server-${{ env.MC_VERSION }}.jar
            ${{ env.SERVER_DIR }}/run.sh
          key: forge-${{ env.MC_VERSION }}-${{ env.FORGE_VERSION }}-optimized-v1

      - name: Install Forge server
        if: steps.forge-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -euo pipefail

          FORGE_FULL="${MC_VERSION}-${FORGE_VERSION}"
          INSTALLER="forge-${FORGE_FULL}-installer.jar"

          curl -fL --retry 3 --retry-delay 2 \
            -o "$INSTALLER" \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_FULL}/${INSTALLER}"

          java -jar "$INSTALLER" --installServer

          echo "eula=true" > eula.txt

      - name: Configure server & optimization
        working-directory: ${{ env.SERVER_DIR }}
        env:
          MAX_PLAYERS: ${{ github.event.inputs.max_players }}
          VIEW_DISTANCE: ${{ github.event.inputs.view_distance }}
          SIMULATION_DISTANCE: ${{ github.event.inputs.simulation_distance }}
          MOTD: ${{ github.event.inputs.motd }}
          MEMORY_GB: ${{ github.event.inputs.memory_gb }}
        run: |
          set -euo pipefail
          mkdir -p mods config

          # Ультра-оптимизированные JVM флаги (Aikar's flags + G1GC tuning)
          MEM="${MEMORY_GB}"
          cat > user_jvm_args.txt <<EOF
          -Xms${MEM}G
          -Xmx${MEM}G
          -XX:+UseG1GC
          -XX:+ParallelRefProcEnabled
          -XX:MaxGCPauseMillis=100
          -XX:+UnlockExperimentalVMOptions
          -XX:+DisableExplicitGC
          -XX:+AlwaysPreTouch
          -XX:G1NewSizePercent=30
          -XX:G1MaxNewSizePercent=40
          -XX:G1HeapRegionSize=16M
          -XX:G1ReservePercent=15
          -XX:G1HeapWastePercent=5
          -XX:G1MixedGCCountTarget=4
          -XX:InitiatingHeapOccupancyPercent=15
          -XX:G1RSetUpdatingPauseTimePercent=5
          -XX:SurvivorRatio=32
          -XX:+PerfDisableSharedMem
          -XX:MaxTenuringThreshold=1
          -Dusing.aikars.flags=https://mcflags.emc.gs
          -Daikars.new.flags=true
          EOF

          # Оптимизированный server.properties для низкого пинга и отклика
          cat > server.properties <<EOF
          online-mode=false
          max-players=${MAX_PLAYERS}
          view-distance=${VIEW_DISTANCE}
          simulation-distance=${SIMULATION_DISTANCE}
          motd=${MOTD}
          spawn-protection=0
          enable-command-block=true
          enable-status=true
          network-compression-threshold=128
          sync-chunk-writes=false
          max-tick-time=60000
          player-idle-timeout=0
          prevent-proxy-connections=false
          enforce-secure-profile=false
          op-permission-level=4
          EOF

      - name: Download essential optimization mods & e4mc
        working-directory: ${{ env.SERVER_DIR }}
        run: |
          set -euo pipefail

          echo "Скачивание e4mc..."
          URL_E4MC=$(curl -fsSL "https://api.modrinth.com/v2/project/e4mc/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | jq -r '.[0].files[0].url')
          curl -fL --retry 3 --retry-delay 2 -o mods/e4mc.jar "$URL_E4MC"

          echo "Скачивание FerriteCore (Оптимизация RAM)..."
          URL_FC=$(curl -fsSL "https://api.modrinth.com/v2/project/ferrite-core/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | jq -r '.[0].files[0].url')
          curl -fL --retry 3 --retry-delay 2 -o mods/ferritecore.jar "$URL_FC"

          echo "Скачивание ModernFix (Ускорение запуска и потоков)..."
          URL_MF=$(curl -fsSL "https://api.modrinth.com/v2/project/modernfix/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | jq -r '.[0].files[0].url')
          curl -fL --retry 3 --retry-delay 2 -o mods/modernfix.jar "$URL_MF"

          echo "Скачивание Embeddium (Оптимизация рендеринга)..."
          URL_EM=$(curl -fsSL "https://api.modrinth.com/v2/project/embeddium/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22forge%22%5D" | jq -r '.[0].files[0].url')
          curl -fL --retry 3 --retry-delay 2 -o mods/embeddium.jar "$URL_EM"

      - name: Copy custom mods from my_mods
        run: |
          set -euo pipefail
          if [ -d my_mods ]; then
            find my_mods -type f -name "*.jar" -exec cp -v {} "${{ env.SERVER_DIR }}/mods/" \;
          fi

      - name: Restore world backup
        run: |
          set -euo pipefail
          if [ -d "$WORLD_BACKUP_DIR" ]; then
            rm -rf "${{ env.SERVER_DIR }}/world"
            mkdir -p "${{ env.SERVER_DIR }}/world"
            cp -a "$WORLD_BACKUP_DIR/." "${{ env.SERVER_DIR }}/world/"
          fi

      - name: Start Forge server with Auto-OP Wrapper
        working-directory: ${{ env.SERVER_DIR }}
        env:
          RUNTIME_MINUTES: ${{ github.event.inputs.runtime_minutes }}
          ADMIN: ${{ github.event.inputs.admin_nickname }}
        run: |
          chmod +x run.sh

          # Запускаем Python-скрипт управления сервером (автоматический OP и контроль таймера)
          python3 - << 'PY'
          import subprocess
          import sys
          import time
          import os

          runtime_minutes = int(os.environ.get("RUNTIME_MINUTES", 120))
          admin_name = os.environ.get("ADMIN", "TWIX_EXTRATOP")

          print(f"[*] Запуск сервера Forge с лимитом {runtime_minutes} минут...")
          process = subprocess.Popen(
              ["./run.sh", "nogui"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          op_sent = False
          start_time = time.time()
          timeout_seconds = runtime_minutes * 60

          try:
              while True:
                  if time.time() - start_time > timeout_seconds:
                      print("\n[*] Время работы вышло. Отправляем команду остановки (stop)...")
                      process.stdin.write("stop\n")
                      process.stdin.flush()
                      break

                  line = process.stdout.readline()
                  if not line and process.poll() is not None:
                      break

                  if line:
                      print(line, end="")
                      # Как только сервер полностью запущен — даем админку
                      if "Done (" in line and not op_sent:
                          print(f"\n[+] Сервер запущен! Выдаем права оператора игроку: {admin_name}\n")
                          process.stdin.write(f"op {admin_name}\n")
                          process.stdin.flush()
                          op_sent = True

          except KeyboardInterrupt:
              process.stdin.write("stop\n")
              process.stdin.flush()

          process.wait()
          print("[*] Сервер успешно остановлен.")
          PY

      - name: Save world backup
        if: always()
        run: |
          set -euo pipefail

          if [ ! -d "${{ env.SERVER_DIR }}/world" ]; then
            echo "No world directory."
            exit 0
          fi

          rm -rf "$WORLD_BACKUP_DIR"
          mkdir -p "$WORLD_BACKUP_DIR"
          cp -a "${{ env.SERVER_DIR }}/world/." "$WORLD_BACKUP_DIR/"

          if [ -z "$(git status --porcelain -- "$WORLD_BACKUP_DIR")" ]; then
            echo "No world changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$WORLD_BACKUP_DIR"
          git commit -m "chore: backup Minecraft world [skip ci]"
          git push
