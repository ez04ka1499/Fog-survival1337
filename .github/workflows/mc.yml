name: Minecraft Forge Server

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Command or Action'
        required: true
        default: 'start'

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Git Identity
        run: |
          git config --global user.name "MC Bot"
          git config --global user.email "bot@github.com"

      - name: Prepare Forge 1.20.1 Server Environment
        run: |
          mkdir server
          cd server
          echo "eula=true" > eula.txt
          
          if [ ! -f "run.sh" ]; then
            curl -o installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-installer.jar
            java -jar installer.jar --installServer
            rm installer.jar
          fi

      - name: Start Minecraft Server & Tunnel
        run: |
          cd server
          mkfifo mc_pipe
          
          # Запуск сервера
          sh run.sh nogui < mc_pipe > ../server.log 2>&1 &
          
          echo "Ожидание запуска сервера..."
          
          # Умный цикл ожидания строки Done в логах
          for i in {1..45}; do
            if grep -q "Done (" ../server.log; then
              echo "Сервер успешно запущен!"
              break
            fi
            sleep 3
          done

          echo "Поднимаем туннель через localhost.run..."
          # Запуск стабильного SSH туннеля
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 localhost.run > ../tunnel.log 2>&1 &
          
          sleep 7
          
          # Выводим содержимое лога туннеля прямо в консоль GitHub Actions, чтобы ты видел IP в логах!
          echo "=== СОДЕРЖИМОЕ ЛОГА ТУННЕЛЯ ==="
          cat ../tunnel.log
          echo "================================"

          # Извлекаем адрес и сохраняем
          TUNNEL_URL=$(grep -o '[a-zA-Z0-9.-]*\.lhr\.life' ../tunnel.log | head -n 1 || echo "")
          
          if [ -z "$TUNNEL_URL" ]; then
            # Запасной вариант поиска порта, если формат изменился
            TUNNEL_URL=$(cat ../tunnel.log | grep -o 'localhost.run.*' | head -n 1)
          fi

          echo "$TUNNEL_URL" > ../tunnel.txt
          echo "Полученный адрес: $TUNNEL_URL"

          git add ../tunnel.txt
          git commit -m "Update server tunnel address [skip ci]" || true
          git push || true

          # Цикл приема команд из панели управления на сайте
          while true; do
            if [ -f ../command.txt ]; then
              CMD=$(cat ../command.txt)
              rm ../command.txt
              
              if [ "$CMD" == "STOP" ]; then
                echo "stop" > mc_pipe
                break
              fi
              
              echo "Выполняю команду: $CMD"
              echo "$CMD" > mc_pipe
            fi
            sleep 3
          done
