name: MC Server

concurrency:
  group: mc-server-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      memory:
        default: '6G'
      view_distance:
        default: '7'
      simulation_distance:
        default: '5'
      online_mode:
        default: 'false'
      difficulty:
        default: normal
      max_players:
        default: '20'
      motd:
        default: 'Minecraft on GitHub'

permissions:
  contents: write

env:
  FORGE: 1.20.1-47.4.0
  TK: ${{ secrets.GITHUB_TOKEN }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: actions/cache@v4
        id: forge
        with:
          path: srv
          key: forge-${{ env.FORGE }}

      - name: Install Forge
        if: steps.forge.outputs.cache-hit != 'true'
        run: |
          wget -q "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
          java -jar "forge-${FORGE}-installer.jar" --installServer ./srv
          echo "eula=true" > srv/eula.txt

      - name: Load world
        run: |
          rm -rf srv/world

          ASSET=$(curl -sf -H "Authorization: Bearer $TK" \
            "https://api.github.com/repos/$REPO/releases/tags/world-save" | \
            python3 -c "import sys,json; a=json.load(sys.stdin).get('assets',[]); print(a[0]['browser_download_url'] if a else '')" 2>/dev/null || true)

          if [ -n "$ASSET" ]; then
            wget -q "$ASSET" -O world.tar.gz
            tar -xzf world.tar.gz -C srv/
            echo "✅ World loaded"
          else
            echo "🌍 Fresh world"
          fi

      - name: Mods and server.properties
        run: |
          rm -rf srv/mods
          mkdir -p srv/mods

          if [ -d mods ]; then
            cp -r mods/. srv/mods/
            echo "📦 $(find srv/mods -type f | wc -l) mod files"
          fi

          MODS=$(curl -sf -H "Authorization: Bearer $TK" \
            "https://api.github.com/repos/$REPO/releases/tags/mods-pack" | \
            python3 -c "import sys,json; a=json.load(sys.stdin).get('assets',[]); print(a[0]['browser_download_url'] if a else '')" 2>/dev/null || true)

          if [ -n "$MODS" ]; then
            wget -q "$MODS" -O mods.tar.gz
            tar -xzf mods.tar.gz -C srv/mods/
          fi

          cat > srv/server.properties <<EOF
          online-mode=${{ inputs.online_mode }}
          view-distance=${{ inputs.view_distance }}
          simulation-distance=${{ inputs.simulation_distance }}
          difficulty=${{ inputs.difficulty }}
          max-players=${{ inputs.max_players }}
          motd=${{ inputs.motd }}
          enable-rcon=true
          rcon.password=${{ secrets.RCON_PASSWORD }}
          rcon.port=25575
          spawn-protection=0
          use-native-transport=true
          network-compression-threshold=256
          entity-broadcast-range-percentage=75
          EOF

      - name: Make TWIX_EXTRATOP operator
        run: |
          python3 - <<'PY'
          import hashlib, json, uuid

          name = "TWIX_EXTRATOP"
          digest = bytearray(hashlib.md5(("OfflinePlayer:" + name).encode("utf-8")).digest())

          digest[6] = (digest[6] & 0x0F) | 0x30
          digest[8] = (digest[8] & 0x3F) | 0x80

          player_uuid = str(uuid.UUID(bytes=bytes(digest)))

          ops = [{
              "uuid": player_uuid,
              "name": name,
              "level": 4,
              "bypassesPlayerLimit": True
          }]

          with open("srv/ops.json", "w", encoding="utf-8") as f:
              json.dump(ops, f, indent=2)

          print("✅ OP added:", name)
          print("UUID:", player_uuid)
          PY

      - name: Start Pinggy tunnel
        run: |
          PT="${{ secrets.PINGGY_TOKEN }}"

          if [ -n "$PT" ]; then
            HOST="${PT}+tcp@pro.pinggy.io"
          else
            HOST="tcp@a.pinggy.io"
          fi

          rm -f /tmp/pinggy.log

          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ExitOnForwardFailure=yes \
              -p 443 \
              -R 0:127.0.0.1:25565 \
              "$HOST" > /tmp/pinggy.log 2>&1 &

          ADDR=""
          for i in $(seq 1 45); do
            ADDR=$(grep -oE 'tcp://[^[:space:]]+' /tmp/pinggy.log | head -n 1 || true)
            [ -n "$ADDR" ] && break
            sleep 2
          done

          if [ -z "$ADDR" ]; then
            echo "❌ Pinggy tunnel failed"
            cat /tmp/pinggy.log
            exit 1
          fi

          echo "$ADDR" > tunnel.txt
          echo "✅ Tunnel: $ADDR"

      - name: Commit tunnel address
        run: |
          git config user.email "bot@ci"
          git config user.name "MC Bot"

          git pull --rebase origin "$BRANCH" || true
          git add tunnel.txt
          git commit -m "🟡 Starting [skip ci]" || true
          git push origin HEAD:"$BRANCH"

      - name: Start Forge
        run: |
          tmux kill-server 2>/dev/null || true
          rm -f /tmp/mc.log

          tmux new-session -d -s mc

          tmux send-keys -t mc "cd srv && java -Xms2G -Xmx${{ inputs.memory }} @libraries/net/minecraftforge/forge/${FORGE}/unix_args.txt nogui 2>&1 | tee /tmp/mc.log" Enter

          for i in $(seq 1 180); do
            if grep -q "Done (" /tmp/mc.log 2>/dev/null; then
              echo "✅ Server ready!"
              exit 0
            fi

            if ! tmux has-session -t mc 2>/dev/null; then
              echo "❌ Minecraft crashed"
              tail -n 100 /tmp/mc.log || true
              exit 1
            fi

            sleep 5
          done

          echo "❌ Server startup timeout"
          tail -n 100 /tmp/mc.log || true
          exit 1

                - name: Downloadable mod configs uses: actions/upload-artifact@v4 with:
          name: mod-configs
          path: |
            srv/config/
            srv/world/serverconfig/
            srv/defaultconfigs/
          if-no-files-found: warn

      - name: Log pusher
        run: |
          while tmux has-session -t mc 2>/dev/null; do
            sleep 15

            [ -f /tmp/mc.log ] || continue

            CONTENT=$(tail -n 300 /tmp/mc.log | base64 -w 0)

            CUR=$(curl -sf -H "Authorization: Bearer $TK" \
              "https://api.github.com/repos/$REPO/contents/server-log.txt?ref=$BRANCH" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)

            PAYLOAD="{\"message\":\"log [skip ci]\",\"content\":\"$CONTENT\",\"branch\":\"$BRANCH\""

            if [ -n "$CUR" ]; then
              PAYLOAD="$PAYLOAD,\"sha\":\"$CUR\""
            fi

            PAYLOAD="$PAYLOAD}"

            curl -sf -X PUT \
              -H "Authorization: Bearer $TK" \
              "https://api.github.com/repos/$REPO/contents/server-log.txt" \
              -d "$PAYLOAD" > /dev/null || true
          done

      - name: RCON command relay
        env:
          RCON_PASS: ${{ secrets.RCON_PASSWORD }}
        run: |
          cat > /tmp/rcon.py <<'PY'
          import socket, struct, sys

          def make_packet(packet_type, payload, request_id=1):
              body = struct.pack("<ii", request_id, packet_type)
              body += payload.encode("utf-8") + b"\x00\x00"
              return struct.pack("<i", len(body)) + body

          def read_packet(sock):
              size_data = b""
              while len(size_data) < 4:
                  chunk = sock.recv(4 - len(size_data))
                  if not chunk:
                      return None, None
                  size_data += chunk

              size = struct.unpack("<i", size_data)[0]
              data = b""

              while len(data) < size:
                  chunk = sock.recv(size - len(data))
                  if not chunk:
                      break
                  data += chunk

              request_id, packet_type = struct.unpack("<ii", data[:8])
              payload = data[8:-2].decode("utf-8", errors="replace")
              return request_id, payload

          password = sys.argv[1]
          command = sys.argv[2]

          sock = socket.create_connection(("127.0.0.1", 25575), timeout=5)
          sock.sendall(make_packet(3, password))

          auth_id, _ = read_packet(sock)

          if auth_id == -1:
              print("❌ RCON authentication failed")
              sys.exit(1)

          sock.sendall(make_packet(2, command, request_id=2))
          _, response = read_packet(sock)
          print(response or "✅ Command sent")
          PY

          LAST_SHA=""

          while tmux has-session -t mc 2>/dev/null; do
            sleep 3

            if ! timeout 2 bash -c "</dev/tcp/127.0.0.1/25575" 2>/dev/null; then
              continue
            fi

            R=$(curl -sf \
              -H "Authorization: Bearer $TK" \
              "https://api.github.com/repos/$REPO/contents/command.txt?ref=$BRANCH" 2>/dev/null || echo '{}')

            SHA=$(echo "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)

            CMD=$(echo "$R" | python3 -c "
          import sys,json,base64
          try:
            d=json.load(sys.stdin)
            print(base64.b64decode(d['content']).decode().strip())
          except Exception:
            print('')
          " 2>/dev/null || true)

            if [ -z "$CMD" ] || [ "$SHA" = "$LAST_SHA" ]; then
              continue
            fi

            LAST_SHA="$SHA"
            echo "→ RCON: $CMD"

            if [ "$CMD" = "STOP" ]; then
              python3 /tmp/rcon.py "$RCON_PASS" "stop" || true
              sleep 25
              break
            fi

            OUT=$(python3 /tmp/rcon.py "$RCON_PASS" "$CMD" 2>&1 || true)

            echo "[$(date -u +%H:%M:%S)] $CMD" >> /tmp/rcon-history.log
            echo "$OUT" >> /tmp/rcon-history.log
            echo "$OUT"

            NEW_CONTENT=$(printf '\n' | base64 -w 0)

            curl -sf -X PUT \
              -H "Authorization: Bearer $TK" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/contents/command.txt" \
              -d "{\"message\":\"cmd [skip ci]\",\"content\":\"$NEW_CONTENT\",\"sha\":\"$SHA\",\"branch\":\"$BRANCH\"}" > /dev/null || true
          done

      - name: Save world
        if: always()
        run: |
          if tmux has-session -t mc 2>/dev/null; then
            python3 /tmp/rcon.py "${{ secrets.RCON_PASSWORD }}" "save-all" 2>/dev/null || true
            sleep 5
            python3 /tmp/rcon.py "${{ secrets.RCON_PASSWORD }}" "stop" 2>/dev/null || true
            sleep 25
          fi

          if [ -d srv/world ]; then
            tar -czf world.tar.gz -C srv world/

            REL=$(curl -sf -H "Authorization: Bearer $TK" \
              "https://api.github.com/repos/$REPO/releases/tags/world-save" || echo '{}')

            RID=$(echo "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)

            if [ -z "$RID" ]; then
              RID=$(curl -sf -X POST \
                -H "Authorization: Bearer $TK" \
                "https://api.github.com/repos/$REPO/releases" \
                -d '{"tag_name":"world-save","name":"World Save","prerelease":true}' | \
                python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            else
              echo "$REL" | python3 -c "import sys,json; [print(a['id']) for a in json.load(sys.stdin).get('assets',[])]" | \
              while read -r AID; do
                if [ -n "$AID" ]; then
                  curl -sf -X DELETE \
                    -H "Authorization: Bearer $TK" \
                    "https://api.github.com/repos/$REPO/releases/assets/$AID" > /dev/null || true
                fi
              done
            fi

            curl -sf -X POST \
              -H "Authorization: Bearer $TK" \
              -H "Content-Type: application/gzip" \
              "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=world.tar.gz" \
              --data-binary @world.tar.gz > /dev/null && echo "✅ World saved"
          fi

          echo "" > tunnel.txt

          git config user.email "bot@ci"
          git config user.name "MC Bot"

          git pull --rebase origin "$BRANCH" || true
          git add tunnel.txt
          git commit -m "🔴 Offline [skip ci]" || true
          git push origin HEAD:"$BRANCH" || true
