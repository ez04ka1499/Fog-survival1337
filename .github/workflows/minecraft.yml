name: Forge 1.20.1 Minecraft Server Pro

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git jq screen

      - name: Setup Forge 1.20.1 Server
        run: |
          mkdir -p server
          cd server

          FORGE_VERSION="1.20.1-47.3.0"
          echo "Скачиваем Forge $FORGE_VERSION..."
          wget -q -O forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          
          echo "Устанавливаем сервер Forge..."
          java -jar forge-installer.jar --installServer > /dev/null

          echo "eula=true" > eula.txt

      - name: Load User Mods & Configs
        run: |
          cd server
          mkdir -p mods

          if [ -d "../my_mods" ]; then
            echo "Копируем пользовательские моды..."
            cp -r ../my_mods/* mods/
          fi

      - name: Restore World from Git
        run: |
          if [ -d "world_backup" ]; then
            echo "Восстанавливаем сохраненный мир..."
            cp -r world_backup/* server/
          fi

      - name: Start Tunnel, Server & Console Bridge
        run: |
          cd server

          # Aikar's Flags для идеальной производительности без лагов
          cat <<EOF > user_args.txt
          -Xms4G
          -Xmx6G
          -XX:+UseG1GC
          -XX:+ParallelRefProcEnabled
          -XX:MaxGCPauseMillis=200
          -XX:+UnlockExperimentalVMOptions
          -XX:+DisableExplicitGC
          -XX:+AlwaysPreTouch
          -XX:G1NewSizePercent=30
          -XX:G1MaxNewSizePercent=40
          -XX:G1HeapRegionSize=8M
          -XX:G1ReservePercent=20
          -XX:G1HeapWastePercent=5
          -XX:G1MixedGCCountTarget=4
          -XX:InitiatingHeapOccupancyPercent=15
          -XX:G1MixedGCLiveThresholdPercent=90
          -XX:RSetUpdatingPauseTimePercent=5
          -XX:SurvivorRatio=32
          -XX:+PerfDisableSharedMem
          -XX:MaxTenuringThreshold=1
          EOF

          echo "Запускаем SSH-туннель (Serveo)..."
          ssh -o StrictHostKeyChecking=no -R 25565:localhost:25565 serveo.net > tunnel.log 2>&1 &

          echo "Ожидание выдачи IP от Serveo..."
          TUNNEL_URL=""
          for i in {1..20}; do
            TUNNEL_URL=$(grep -oE "([a-zA-Z0-9.-]+\.serveo\.net)" tunnel.log || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "========================================"
          echo "SERVER_IP: ${TUNNEL_URL:-Не удалось получить адрес}:25565"
          echo "========================================"

          echo "Запускаем сервер Minecraft в фоновом screen-сеансе..."
          screen -S mc -d -m bash run.sh

          # Фоновый процесс-мост для консоли: проверяет command.txt и шлет команды в сервер
          cd ..
          (
            LAST_CMD=""
            while true; do
              sleep 3
              git pull origin main --quiet || true
              if [ -f "command.txt" ]; then
                CMD=$(cat command.txt)
                if [ -n "$CMD" ] && [ "$CMD" != "$LAST_CMD" ]; then
                  echo "Отправка команды в сервер: $CMD"
                  screen -S mc -p 0 -X stuff "$CMD\n"
                  LAST_CMD="$CMD"
                fi
              fi
            done
          ) &

          # Ждем завершения работы сервера (пока процесс screen живет)
          while screen -list | grep -q "mc"; do
            sleep 10
          done

      - name: Save World & Commit to Git
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          mkdir -p world_backup
          [ -d "server/world" ] && cp -r server/world world_backup/
          
          git add world_backup/
          git commit -m "Автосохранение мира [skip ci]" || echo "Изменений в мире нет."
          git push
