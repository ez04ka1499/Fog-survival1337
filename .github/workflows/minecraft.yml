name: Forge 1.20.1 Minecraft Server (Custom Tunnel)

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl git jq python3

      - name: Setup Forge 1.20.1 Server
        run: |
          mkdir -p server
          cd server

          FORGE_VERSION="1.20.1-47.3.0"
          echo "Скачиваем Forge $FORGE_VERSION..."
          wget -q -O forge-installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          
          echo "Устанавливаем сервер Forge..."
          java -jar forge-installer.jar --installServer > /dev/null

          echo "eula=true" > eula.txt

      - name: Load User Mods
        run: |
          cd server
          mkdir -p mods

          if [ -d "../my_mods" ]; then
            echo "Копируем пользовательские моды..."
            cp -r ../my_mods/* mods/
          fi

      - name: Configure server.properties
        run: |
          cd server
          cat <<EOF > server.properties
          online-mode=false
          view-distance=8
          simulation-distance=6
          max-players=5
          spawn-protection=0
          enable-command-block=true
          motd=GitHub Custom Forge Server
          EOF

      - name: Restore World & Ops from Git
        run: |
          if [ -d "world_backup" ]; then
            echo "Восстанавливаем сохраненный мир..."
            cp -r world_backup/* server/
          fi

      - name: Run Custom Tunnel & Forge Server
        run: |
          cd server

          echo "-Xms4G" > user_args.txt
          echo "-Xmx6G" >> user_args.txt

          # Запускаем фоновый процесс создания быстрого европейского TCP-туннеля (без регистрации и ключей)
          echo "Запускаем кастомный туннель через SSH (localhost.run)..."
          # Пробрасываем порт 25565 наружу через европейский узел без ключей
          ssh -o StrictHostKeyChecking=no -R 80:localhost:25565 localhost.run > tunnel.log 2>&1 &

          # Небольшая пауза, чтобы туннель успел получить адрес
          sleep 5
          
          echo "=== АДРЕС ТУННЕЛЯ ДЛЯ ПОДКЛЮЧЕНИЯ ==="
          cat tunnel.log | grep -oE "https://[a-zA-Z0-9.-]+" || echo "Ищем адрес в логах туннеля..."
          echo "========================================"

          echo "Запускаем сервер Minecraft..."
          bash run.sh || true

      - name: Save World & Commit to Git
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          mkdir -p world_backup
          [ -d "server/world" ] && cp -r server/world world_backup/
          
          git add world_backup/
          git commit -m "Автосохранение мира Forge [skip ci]" || echo "Изменений в мире нет."
          git push
